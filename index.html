<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - লিংক ছোট করুন</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- হেডার -->
        <header class="header">
            <h1>🔗 URL Shortener</h1>
            <p>আপনার লিংক ছোট করুন এবং ট্রাফিক ট্র্যাক করুন</p>
        </header>

        <!-- ট্যাব নেভিগেশন -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('create')">নতুন লিংক তৈরি করুন</button>
            <button class="tab-btn" onclick="showTab('stats')">পরিসংখ্যান দেখুন</button>
        </div>

        <!-- ট্যাব 1: নতুন লিংক তৈরি করুন -->
        <div id="create" class="tab-content active">
            <div class="form-container">
                <h2>নতুন শর্টেনড লিংক তৈরি করুন</h2>
                
                <div class="form-group">
                    <label for="originalUrl">আসল URL:</label>
                    <input type="url" id="originalUrl" placeholder="https://example.com/very-long-url" required>
                </div>

                <div class="form-group">
                    <label for="title">টাইটেল:</label>
                    <input type="text" id="title" placeholder="আপনার লিংকের নাম দিন" required>
                </div>

                <div class="form-group">
                    <label for="imageUrl">ইমেজ URL:</label>
                    <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
                    <small>ছবি যোগ করুন (ঐচ্ছিক)</small>
                </div>

                <div class="form-group">
                    <label for="description">বর্ণনা:</label>
                    <textarea id="description" placeholder="এই লিংক সম্পর্কে কিছু বলুন..." rows="3"></textarea>
                </div>

                <button class="btn-primary" onclick="createShortLink()">শর্টেনড লিংক তৈরি করুন</button>
            </div>

            <!-- তৈরিকৃত লিংক প্রদর্শন -->
            <div id="resultContainer" class="result-container" style="display:none;">
                <h3>✅ আপনার শর্টেনড লিংক প্রস্তুত!</h3>
                <div class="result-box">
                    <div class="result-item">
                        <label>শর্টেনড লিংক:</label>
                        <div class="copy-container">
                            <input type="text" id="shortLink" readonly>
                            <button class="btn-copy" onclick="copyToClipboard('shortLink')">কপি করুন</button>
                        </div>
                    </div>
                    <div class="result-item">
                        <label>কিউআর কোড:</label>
                        <div id="qrCode"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ট্যাব 2: পরিসংখ্যান দেখুন -->
        <div id="stats" class="tab-content">
            <div class="stats-container">
                <h2>📊 আপনার লিংকের পরিসংখ্যান</h2>
                
                <div class="stats-header">
                    <div class="stat-card">
                        <h3>মোট লিংক</h3>
                        <p class="stat-number" id="totalLinks">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>মোট ক্লিক</h3>
                        <p class="stat-number" id="totalClicks">0</p>
                    </div>
                </div>

                <div id="linksList" class="links-list">
                    <p class="empty-message">এখনও কোনো লিংক তৈরি করা হয়নি।</p>
                </div>
            </div>
        </div>
    </div>

    <!-- লিংক রিডিরেক্ট পেজ (লুকানো) -->
    <div id="redirectPage" class="redirect-page" style="display:none;">
        <div class="redirect-content">
            <img id="redirectImage" src="" alt="">
            <h2 id="redirectTitle"></h2>
            <p id="redirectDescription"></p>
            <p class="redirect-message">আপনাকে রিডিরেক্ট করা হচ্ছে...</p>
            <p class="redirect-url" id="redirectUrl"></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
