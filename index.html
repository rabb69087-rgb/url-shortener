<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Under Maintenance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #34373d 0%, #202227 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    padding: 24px;
    min-height: 100%;
    overflow: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(96,165,250,0.10) 0%, rgba(96,165,250,0) 70%);
    border-radius: 50%;
    top: -150px;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .code {
    font-size: clamp(70px, 14vw, 120px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #ffffff 0%, #9aa3af 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: floatUp 3.5s ease-in-out infinite;
  }

  @keyframes floatUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .title {
    font-size: 28px;
    font-weight: 600;
    color: #ffffff;
    margin-top: 22px;
    letter-spacing: 0.2px;
  }

  .desc {
    font-size: 15.5px;
    color: #9aa0a8;
    margin-top: 12px;
    max-width: 420px;
    line-height: 1.65;
  }

  .progress-wrap {
    margin-top: 36px;
    width: 320px;
    max-width: 80vw;
  }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: #8b9099;
    margin-bottom: 8px;
  }

  .progress-percent {
    color: #60a5fa;
    font-weight: 600;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd);
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
    transition: width 0.4s ease;
  }

  @keyframes shimmer {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  .meta {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #767a82;
    font-size: 13px;
  }

  .meta svg {
    width: 15px;
    height: 15px;
    stroke: #767a82;
    flex-shrink: 0;
  }

  .socials {
    margin-top: 34px;
    display: flex;
    gap: 14px;
  }

  .socials a {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, transform 0.2s;
    text-decoration: none;
  }

  .socials a:hover {
    border-color: rgba(96,165,250,0.5);
    transform: translateY(-2px);
  }

  .socials svg {
    width: 16px;
    height: 16px;
    stroke: #b7bcc4;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
    width: 100%;
    max-width: 480px;
  }

  .footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 22px;
  }

  .footer-links a {
    font-size: 13px;
    color: #9aa0a8;
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-links a:hover {
    color: #60a5fa;
  }

  .copyright {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #5e636b;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="card">
    <div class="code">404</div>
    <div class="title">Site under maintenance</div>
    <div class="desc">We're currently performing scheduled maintenance to improve your experience. We'll be back online shortly.</div>

    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Progress</span>
        <span class="progress-percent" id="percentLabel">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="meta">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span>Estimated downtime: a few hours</span>
    </div>

    <div class="socials">
      <a href="#" aria-label="Twitter">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.6 1.5 9.2 5 5c2 2.5 5 4 8 4.1V8a4 4 0 0 1 7-2.7c1.1 0 2-1.3 2-1.3z"/></svg>
      </a>
      <a href="#" aria-label="Mail">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </a>
      <a href="#" aria-label="Status page">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </a>
    </div>
  </div>

  <footer>
    <nav class="footer-links" aria-label="Footer">
      <a href="/contact-us">Contact Us</a>
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="/dmca-notice">DMCA Notice</a>
      <a href="/about-us">About Us</a>
      <a href="/terms-and-conditions">Terms and Conditions</a>
    </nav>
    <div class="copyright">&copy; 2026 Your Company. All rights reserved.</div>
  </footer>

  <script>
    // Working progress percentage.
    // Set TARGET_PERCENT to your real completion (0-100),
    // or define startTime/endTime below to drive it from a real maintenance window.
    const TARGET_PERCENT = 62;

    // Optional: drive percent from an actual time window instead of a fixed number.
    // Uncomment and set real dates to make the bar reflect real elapsed time.
    // const startTime = new Date("2026-06-22T00:00:00Z").getTime();
    // const endTime   = new Date("2026-06-22T06:00:00Z").getTime();

    const fill = document.getElementById('progressFill');
    const label = document.getElementById('percentLabel');

    function computePercent() {
      if (typeof startTime !== 'undefined' && typeof endTime !== 'undefined') {
        const now = Date.now();
        const pct = ((now - startTime) / (endTime - startTime)) * 100;
        return Math.max(0, Math.min(100, Math.round(pct)));
      }
      return TARGET_PERCENT;
    }

    function animateTo(target) {
      let current = 0;
      const step = () => {
        current += Math.max(1, (target - current) * 0.08);
        if (current >= target) current = target;
        fill.style.width = current + '%';
        label.textContent = Math.round(current) + '%';
        if (current < target) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    animateTo(computePercent());

    if (typeof startTime !== 'undefined' && typeof endTime !== 'undefined') {
      setInterval(() => {
        const pct = computePercent();
        fill.style.width = pct + '%';
        label.textContent = pct + '%';
      }, 30000);
    }
  </script>
</body>
</html>
